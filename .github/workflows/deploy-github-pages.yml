# Construit l'export statique Next.js et le publie sur GitHub Pages.
#
# Prérequis, à faire une seule fois dans le dépôt :
#   Settings → Pages → Build and deployment → Source : « GitHub Actions »
#
# Le déclencheur manuel (« Run workflow ») n'apparaît dans l'onglet Actions
# qu'une fois ce fichier présent sur la branche par défaut.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions minimales nécessaires au déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          # Next.js 16 exige Node.js 20.9 minimum.
          node-version: 22
          cache: npm

      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Construire l'export statique
        env:
          # Pour un site « projet », base_path vaut « /bowly-s » ; il est
          # normalisé dans next.config.ts. Pour un site utilisateur, il est
          # vide et le site est servi à la racine.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # URL complète du site, utilisée par `metadataBase` (Open Graph).
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - name: Désactiver Jekyll
        # Sans ce fichier, un hébergement Pages passant par Jekyll ignorerait
        # le dossier `_next/` (préfixé par un underscore) et le site
        # s'afficherait sans CSS ni JavaScript.
        run: touch out/.nojekyll

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Un déploiement « réussi » ne prouve pas que le bon site est en ligne : si
  # la source Pages est restée sur « Deploy from a branch », le build Jekyll
  # historique (workflow `pages-build-deployment`) tourne en parallèle, publie
  # la racine du dépôt — donc le README — et écrase cet artefact en gagnant la
  # course. Ce job interroge l'URL réellement servie.
  verifier:
    name: Vérification du site publié
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: L'URL publiée sert-elle bien le site Next.js ?
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -u
          if [ -z "${URL}" ]; then
            echo "::error::URL de publication introuvable."
            exit 1
          fi

          echo "Vérification de ${URL}"
          for tentative in 1 2 3 4; do
            # Laisse le CDN propager et un éventuel build concurrent finir.
            sleep 30
            corps=$(curl -sSL --max-time 30 "${URL}" || true)

            if printf '%s' "${corps}" | grep -q '_next/static'; then
              echo "✅ Le site Next.js est bien servi sur ${URL}"
              exit 0
            fi

            echo "Tentative ${tentative}/4 : le bundle Next.js est absent de la page."
          done

          echo "::error::${URL} ne sert PAS le site Next.js."
          echo ""
          echo "Cause la plus probable : la source GitHub Pages est restée sur"
          echo "« Deploy from a branch ». Le workflow « pages build and deployment »"
          echo "publie alors la racine du dépôt (donc README.md) et écrase cet"
          echo "artefact."
          echo ""
          echo "Correction : Settings > Pages > Build and deployment >"
          echo "Source = « GitHub Actions ». Si c'est déjà le cas, basculer sur"
          echo "« Deploy from a branch » puis revenir sur « GitHub Actions » pour"
          echo "forcer la désactivation du build Jekyll, et vérifier dans l'onglet"
          echo "Actions que « pages build and deployment » ne se déclenche plus."
          exit 1
